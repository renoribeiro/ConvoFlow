project_id = "pqjkuwyshybxldzpfbbs"

[functions.evolution-webhook]
# Evolution calls this webhook externally without a Supabase JWT; the function
# authenticates each request via the per-instance apikey (and optional
# EVOLUTION_WEBHOOK_SECRET). Must stay false or the gateway 401s real webhooks.
verify_jwt = false

[functions.waha-webhook]
# WAHA does not send a JWT; we authenticate via a shared secret header
# (WAHA_WEBHOOK_SECRET). See supabase/functions/waha-webhook/index.ts.
verify_jwt = false

[functions.automation-processor]
# Called server-to-server (DB trigger or other Edge Functions) with
# service_role. Tenant isolation is enforced inside the handler.
verify_jwt = true

[functions.stripe-webhook]
# Stripe signs payloads with Stripe-Signature; the handler verifies the
# signature, so JWT verification is disabled at the gateway.
verify_jwt = false

[functions.create-checkout-session]
# Chamada a partir de uma sessão de usuário autenticado. Resolve o tenant_id no
# servidor (a partir de profiles) e cria a sessão de Stripe Checkout. JWT
# obrigatório no gateway.
verify_jwt = true

[functions.job-worker]
verify_jwt = true

[functions.meta-webhook]
verify_jwt = false

[functions.whatsapp-meta-setup]
verify_jwt = true

[functions.meta-oauth-exchange]
# Completes the Embedded Signup OAuth flow (code -> token -> WABA subscribe ->
# instance creation). Called from an authenticated user session, so JWT
# verification is required — same setting as whatsapp-meta-setup.
verify_jwt = true

[functions.whatsapp-send-message]
verify_jwt = true

[functions.list-whatsapp-templates]
verify_jwt = true

[functions.manage-user]
verify_jwt = true

[functions.create-store]
# Cria uma Loja dentro da Conta do Gerente logado. `public.tenants` não tem
# policy de INSERT para gerente, então a escrita é feita aqui com a service key
# depois de conferir permissão e vaga. O caller é resolvido pelo JWT — nada
# relativo a cargo vem do corpo da requisição.
verify_jwt = true

[functions.track-login]
verify_jwt = true

[functions.usage-limits]
verify_jwt = true

[functions.admin-create-user]
verify_jwt = true

[functions.send-report]
# Gera relatório com dados reais do tenant e envia por e-mail (Resend).
# Autentica o caller pelo JWT e resolve o tenant_id internamente.
verify_jwt = true

[functions.process-chatbot-message]
# Called server-to-server only (from evolution-webhook, waha-webhook,
# meta-webhook). No user JWT is available in webhook context, so JWT
# verification is disabled. Origin is validated inside the handler via
# the CHATBOT_ENGINE_SECRET shared secret (x-internal-secret header).
verify_jwt = false

[functions.process-campaign-dispatch]
# Invoked by pg_cron (anon bearer) and optionally by super admins.
# Authentication relies on SUPABASE_SERVICE_ROLE_KEY inside the handler;
# the function itself does not require a user JWT at the gateway level.
verify_jwt = false

[functions.register-meta-number]
# Registers an already-onboarded Meta WhatsApp phone number (SKILL.md §6.3).
# Called from an authenticated user session; JWT verification is required.
verify_jwt = true

[functions.policy-watch]
# Vigia das políticas de uso aceitável do WhatsApp/Meta. Invocado pelo pg_cron
# (anon bearer) e opcionalmente por super admins; autentica internamente via
# SUPABASE_SERVICE_ROLE_KEY (mesmo padrão de process-campaign-dispatch).
verify_jwt = false

[functions.process-followup-dispatch]
# Motor de follow-up dirigido por pg_cron (anon bearer); autentica internamente
# via SUPABASE_SERVICE_ROLE_KEY (mesmo padrão de process-campaign-dispatch).
# Dispara agendados, avança sequências e gera recorrências.
verify_jwt = false

[functions.process-report-dispatch]
# Envia os relatórios agendados (report_schedules). Dirigido por pg_cron a cada
# 5 minutos (anon bearer); autentica internamente via SUPABASE_SERVICE_ROLE_KEY
# (mesmo padrão de process-campaign-dispatch). Percorre todas as Contas, e o
# tenant_id de cada relatório sai sempre da própria agenda.
verify_jwt = false

[functions.webhook-dispatcher]
# Consome a fila webhook_deliveries e faz POST nos webhooks de saída do usuário.
# Dirigido por pg_cron (anon bearer); autentica internamente via
# SUPABASE_SERVICE_ROLE_KEY (mesmo padrão de process-campaign-dispatch).
verify_jwt = false